name: Mecateando
options:
  bundleIdPrefix: com.ridel007
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mecateando:
    type: application
    platform: iOS
    sources:
      - path: Sources/Mecateando
      - path: Sources/Mecateando/Preview Content
        buildPhase: resources
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridel007.gastossms
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Sources/Mecateando/Preview Content\""
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Mecateando.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ridel007.gastossms
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Mecateando
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: ShareExtension
        embed: true
    testTargets:
      - name: MecateandoTests
        type: bundle.unit-test
        platform: iOS
        sources:
          - path: Tests/MecateandoTests
        dependencies:
          - target: Mecateando

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridel007.gastossms.ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ridel007.gastossms
    info:
      path: Generated-ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: Mecateando
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
