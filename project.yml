name: GastosSMS
options:
  bundleIdPrefix: com.ridel007
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GastosSMS:
    type: application
    platform: iOS
    sources:
      - path: Sources/GastosSMS
      - path: Sources/GastosSMS/Preview Content
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridel007.gastossms
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Sources/GastosSMS/Preview Content\""
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Mecateando
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    testTargets:
      - name: GastosSMSTests
        type: bundle.unit-test
        platform: iOS
        sources:
          - path: Tests/GastosSMSTests
        dependencies:
          - target: GastosSMS
